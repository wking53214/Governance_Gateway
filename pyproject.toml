[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "governance-gateway"
version = "0.1.0"
description = "Minimal, platform-neutral governance boundary for immutable governed artifacts."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
# Optional: lets the gateway's verdicts be expressed as CNS gate results.
# governance_gateway imports nothing from CNS unless
# governance_gateway.cns_connector is used. Pinned to tag v1.4.0.
cns = [
    "cns @ git+https://github.com/wking53214/cns.git@3b465dbcc1a6a4ab6f1040f93d44483196abd737",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Bare `pytest` from a clone, without `pip install -e .`, collected three
# errors because the package lives under src/. Measured 2026-09-08.
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
